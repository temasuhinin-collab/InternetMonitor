name: Build Car Manager

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Windows EXE

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Check Python
        shell: pwsh
        run: |
          python --version
          pyinstaller --version

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name CarManager `
            app.py

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\CarManager.exe")) {
            Write-Error "CarManager.exe was not created."
            exit 1
          }

          $file = Get-Item "dist\CarManager.exe"

          Write-Host "================================="
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"
          Write-Host "================================="

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CarManager-3.1-Windows
          path: dist/CarManager.exe
          if-no-files-found: error
