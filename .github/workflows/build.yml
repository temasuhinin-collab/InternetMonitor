name: Build Car Manager

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Windows EXE

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Check environment
        shell: pwsh
        run: |
          python --version
          pyinstaller --version

      - name: Build Car Manager
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name CarManager `
            app.py

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\CarManager.exe")) {
            Write-Error "CarManager.exe was not created."
            exit 1
          }

          $file = Get-Item "dist\CarManager.exe"

          Write-Host "======================================"
          Write-Host "CAR MANAGER BUILD SUCCESSFUL"
          Write-Host "Version: 3.2.0"
          Write-Host "Author: Artem Sukhinin"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"
          Write-Host "======================================"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CarManager-3.2-Windows
          path: dist/CarManager.exe
          if-no-files-found: error
