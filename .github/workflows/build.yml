name: Build Car Manager 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Car Manager 3.0
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name CarManager `
            app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\CarManager.exe")) {
            Write-Error "CarManager.exe was not created."
            exit 1
          }

          Get-Item "dist\CarManager.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: CarManager-3.0-Windows
          path: dist/CarManager.exe
          if-no-files-found: error
