name: Build Internet Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Windows EXE

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name InternetMonitor app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InternetMonitor-Windows
          path: dist/InternetMonitor.exe
